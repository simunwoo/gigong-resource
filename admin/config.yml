backend:
  name: github
  repo: YOUR_GITHUB_ID/gigong-resource
  branch: main
locale: ko
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
collections:
  - name: "settings"
    label: "홈페이지 관리"
    files:
      - name: "business"
        label: "기본정보"
        file: "content/business.json"
        format: "json"
        fields:
          - {label: "상호", name: "businessName", widget: "string"}
          - {label: "대표자", name: "owner", widget: "string"}
          - {label: "전화번호", name: "phone", widget: "string"}
          - {label: "주소", name: "address", widget: "string"}
          - {label: "평일 영업시간", name: "weekdayHours", widget: "string"}
          - {label: "토요일 영업시간", name: "saturdayHours", widget: "string"}
          - {label: "일요일", name: "sundayHours", widget: "string"}
          - {label: "메인 상단 문구", name: "heroKicker", widget: "string"}
          - {label: "메인 제목", name: "heroTitle", widget: "string"}
          - {label: "메인 설명", name: "heroDescription", widget: "text"}
          - {label: "메인 대표사진", name: "heroImage", widget: "image", required: false}
          - {label: "SEO 제목", name: "seoTitle", widget: "string"}
          - {label: "SEO 설명", name: "seoDescription", widget: "text"}
  - name: "cases"
    label: "수거·매입 사례"
    folder: "content/cases"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "등록일", name: "date", widget: "datetime"}
      - {label: "지역", name: "area", widget: "string"}
      - {label: "품목", name: "item", widget: "string"}
      - {label: "대표사진", name: "image", widget: "image"}
      - {label: "작업내용", name: "body", widget: "markdown"}
  - name: "notices"
    label: "공지사항"
    folder: "content/notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "등록일", name: "date", widget: "datetime"}
      - {label: "내용", name: "body", widget: "markdown"}
